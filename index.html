<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mario Kart World "Randomizer"</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="rooty">
        <div class="image" onclick="playAnim()">Image
        </div>
        <!--
            the idea:
            js sets the dummy as the next track
            they all animate and move down
            once they do, js "moves" the track names down by 1 and resets anim
            seamlessly so you cant notice this
        -->
        <ul class="tracks">
            <li id="dummy"></li>
            <li id="t1"></li>
            <li id="t2"></li>
            <li id="t3"></li>
            <li id="t4"></li>
            <li id="t5"></li>
        <ul/>
    </div>
</body>
<script src="script.js"></script>
</html>
